name: Flatpak

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "master" ]
    types: [ "opened", "synchronize", "reopened", "ready_for_review" ]

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: "Flatpak"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: high-tide.flatpak
          manifest-path: build-aux/io.github.nokse22.high-tide.json
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true
      - name: Check that the app starts
        run: |
          flatpak install --user -y --noninteractive high-tide.flatpak
          export XDG_RUNTIME_DIR=$(mktemp -d)
          # No login or secret service, on GTK's virtual display: the app builds
          # its main window and shows the secret portal dialog
          dbus-run-session -- flatpak run --no-a11y-bus --env=GSETTINGS_BACKEND=memory \
            --filesystem="$GITHUB_WORKSPACE:ro" --command=sh io.github.nokse22.high-tide -c \
            "gtk4-broadwayd :5 & sleep 2; GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 python3 '$GITHUB_WORKSPACE/build-aux/startup-check.py'"
